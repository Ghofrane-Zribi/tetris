<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game">
      <h1>Tetris</h1>
      <div class="game-layout">
        <canvas id="game-canvas" aria-label="Plateau de jeu Tetris"></canvas>
        <aside class="sidebar" aria-label="Informations de la partie">
          <div class="next-piece">
            <h2>Pièce suivante</h2>
            <canvas id="next-piece-canvas" aria-label="Pièce suivante"></canvas>
          </div>
          <p>Score <strong id="score">0</strong></p>
          <p>Niveau <strong id="level">1</strong></p>
          <p>Lignes <strong id="lines">0</strong></p>
          <p id="status">Prêt</p>
          <div class="buttons">
            <button id="start-button" type="button">Start</button>
            <button id="pause-button" type="button">Pause</button>
            <button id="restart-button" type="button">Restart</button>
          </div>
        </aside>
      </div>
      <p class="controls">
        Utilisez les flèches gauche/droite pour déplacer la pièce,
        <kbd>↑</kbd> pour la tourner, <kbd>↓</kbd> pour accélérer sa chute et
        <kbd>P</kbd> pour mettre en pause.
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
