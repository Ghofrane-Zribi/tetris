<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game">
      <h1>Tetris</h1>
      <canvas id="game-canvas" aria-label="Plateau de jeu Tetris"></canvas>
      <p class="controls">
        Utilisez les flèches gauche/droite pour déplacer la pièce,
        <kbd>↑</kbd> pour la tourner et <kbd>↓</kbd> pour accélérer sa chute.
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
